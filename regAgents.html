<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reg agents</title>
    <style>
        body {
            margin: 0;
            background-color: #2d2d2d;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            animation: fadeIn 2s ease-in-out;
        }

        .button {
            margin: 1rem;
            padding: 0.7rem 1.5rem;
            font-size: 1rem;
            text-transform: uppercase;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        button:hover {
            background-color: #005f99;
        }

        .button:active {
            transform: scale(0.95);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .custom-cursor {
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid #00bbff;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Web App Hub</h1>
        <button class="button" onclick="window.location.href='jsnippetgen.html'">JSnippetGen</button>
        <button class="button" onclick="window.location.href='twigsmith.html'">TwigSmith</button>
    </div>
    <div class="custom-cursor" id="cursor"></div>
    <script>
        // Custom Cursor
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.pageX}px`;
            cursor.style.top = `${e.pageY}px`;
        });
    </script>
</body>
</html>
