<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jsnippetgen-login</title>
  <style>
    /* General Reset */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background: #1c1c1c; /* Fallback background */
      color: #fff;
    }

    /* Particles.js container */
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1; /* Ensures particles are behind the content */
    }

    /* Center the login card */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    /* Login card styling */
    .login-card {
      background: rgba(20, 20, 20, 0.9); /* Semi-transparent dark background */
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      text-align: center;
      width: 100%;
      max-width: 400px;
      height: 15;
      z-index: 2; /* Ensures the card is above particles */
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Hover effect on card */
    .login-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
    }

    .login-card h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .login-card input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    .login-card input:focus {
      border-color: #007bff;
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #007bff; /* Bright blue */
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card button:hover {
      background: #0056d6; /* Slightly darker blue */
      box-shadow: 0 0 20px rgba(0, 91, 214, 0.7);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const passwordInput = document.getElementById('password');
      const messages = [
        "Hey user, how you doin'?",
        "Enter the password you were given",
        "Make sure to type it correctly",
        "Only authenticated users allowed"
      ];

      let currentMessageIndex = 0;
      let charIndex = 0;

      const typePlaceholder = () => {
        const currentMessage = messages[currentMessageIndex];
        if (charIndex <= currentMessage.length) {
          passwordInput.placeholder = currentMessage.slice(0, charIndex);
          charIndex++;
          setTimeout(typePlaceholder, 100); // Adjust speed by changing the timeout (in ms)
        } else {
          // Pause before starting the next message
          setTimeout(() => {
            charIndex = 0;
            currentMessageIndex = (currentMessageIndex + 1) % messages.length; // Loop through messages
            typePlaceholder();
          }, 1000); 
        }
      };

      typePlaceholder();

      // Initialize particles.js with the correct configuration
      particlesJS('particles-js', {
        particles: {
          number: { value: 100, density: { enable: true, value_area: 800 } },
          color: { value: '#ffffff' },
          shape: {
            type: 'circle',
            stroke: { width: 0, color: '#000000' },
            polygon: { nb_sides: 5 }
          },
          opacity: {
            value: 0.5,
            random: false,
            anim: { enable: false, speed: 1, opacity_min: 0.1, sync: false }
          },
          size: {
            value: 3,
            random: true,
            anim: { enable: false, speed: 40, size_min: 0.1, sync: false }
          },
          line_linked: {
            enable: true,
            distance: 150,
            color: '#ffffff',
            opacity: 0.4,
            width: 1
          },
          move: {
            enable: true,
            speed: 6,
            direction: 'none',
            random: false,
            straight: false,
            out_mode: 'out',
            attract: { enable: false, rotateX: 600, rotateY: 1200 }
          }
        },
        interactivity: {
          detect_on: 'canvas',
          events: {
            onhover: { enable: true, mode: 'grab' },
            onclick: { enable: true, mode: 'push' },
            resize: true
          },
          modes: {
            grab: { distance: 140, line_linked: { opacity: 1 } },
            bubble: { distance: 400, size: 40, duration: 2, opacity: 8, speed: 3 },
            repulse: { distance: 200, duration: 0.4 },
            push: { particles_nb: 4 },
            remove: { particles_nb: 2 }
          }
        },
        retina_detect: true
      });

      // Login form functionality (optional example logic)
      document.getElementById('login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  
  const password = document.getElementById('password').value;

  // Secret passphrase to check (encode using Base64 for simplicity)
  const secretKey = "LetMeIn@Gevme"; // Password to be shared
  const encodedKey = btoa(secretKey); // Encode using Base64
  
  // User input is encoded for validation
  const userKey = btoa(password);
  
  if (userKey === encodedKey) {
    localStorage.setItem('isLoggedIn', 'true');
    window.location.href = 'jsnippetgen.html';
    alert('Login Successful!');
  } else {
    alert('Access Denied');
  }
      });
    });

    
  </script>
</head>
<body>
  <div id="particles-js"></div> <!-- Particles container -->
  <div class="login-container">
    <form class="login-card" id="login-form" aria-label="Login Form">
      <h1>Enter Your Password</h1>
      <input type="password" id="password" placeholder="Enter a strong password" required aria-label="Password Input">
      <button type="submit">Log In</button>
    </form>
  </div>
</body>
</html>
